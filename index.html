html,body{margin:0;min-height:100%}
body{background:var(--bg) var(--paper);color:var(--ink);font:16px/1.45 Figtree,system-ui,sans-serif;padding-top:env(safe-area-inset-top)}

button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}

.page{max-width:760px;margin:0 auto;padding:16px 16px calc(90px + env(safe-area-inset-bottom))}
.bar{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--panel);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:5}

.btn.ghost{background:none;color:var(--ink);border:1px solid var(--line)}

.toast{position:fixed;bottom:calc(76px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--cream);padding:10px 18px;border-radius:99px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:9}
.toast.show{opacity:1}
.login{display:grid;justify-items:center;min-height:100vh;text-align:center;gap:14px;align-content:center;max-width:340px;margin:0 auto;padding:0 16px}
.login h1{font-size:40px}
.login .fld{width:100%;text-align:left}
.login .acts{width:100%}
.err{color:#a2392b;min-height:1.4em;margin:0}
.tip{position:sticky;bottom:calc(135px + env(safe-area-inset-bottom));background:var(--ink);color:var(--cream);border-radius:var(--r);padding:10px 14px;margin:10px 0;z-index:4;cursor:pointer}
.tip small{color:#d9bf9c}
.ov{position:fixed;inset:0;background:var(--bg) var(--paper);overflow:auto;z-index:8;padding-top:env(safe-area-inset-top)}
.wheel{display:block;width:100%;max-width:340px;margin:10px auto}.wheel g{cursor:pointer;outline:none}.wheel g:focus-visible path{stroke:var(--ink);stroke-width:3}
.cmp{display:grid;grid-template-columns:72px 1fr 1fr;gap:6px 10px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px;margin:10px 0}.cmp>*{min-width:0;overflow-wrap:anywhere}
.pill{display:inline-block;border:1px solid var(--line);border-radius:99px;padding:3px 10px;margin:2px 4px 2px 0;background:var(--panel);font-size:14px}.pill.sh{background:var(--brown);border-color:var(--brown);color:var(--cream)}
span.heart{display:inline-block;text-align:center;line-height:44px;pointer-events:none}
.ver{font:12px Figtree,system-ui,sans-serif;color:var(--mute)}
.hero .ver{color:#d9bf9c}
@media(max-width:560px){.top{grid-template-columns:110px 1fr}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

  </div>
  ${LOCAL ? "<span></span>" : `<button class="lo" data-a="out">Sign out</button>`}</div></div>`;

const detailHtml = n => { const [w = "", t = ""] = DETAIL[n] || [], l = n.toLowerCase(); return `<div class="row card"><h3>${n}</h3>${w}<br><small>Where you might notice it: ${t}</small><br><small>In a note: "A light ${l} note on the nose." or "${n} comes through on the taste."</small></div>`; };
const learn = () => `<h2>Flavour Guide</h2><div class="tabs"><button class="tab ${gTab === "cat" ? "on" : ""}" data-gt="cat">Categories</button><button class="tab ${gTab === "ex" ? "on" : ""}" data-gt="ex">Examples</button><button class="tab ${gTab === "wh" ? "on" : ""}" data-gt="wh">Wheel</button></div>
  ${gTab === "wh" ? wheelPage() : gTab === "cat" ? GUIDE.map(([n, d]) => `<button class="row card" data-gc="${n}"><b>${n}</b><br>${d}</button>${gSel === n ? `<div class="tabs">${SPEC[n].map(x => `<button class="tab" data-gd="${esc(x)}">${x}</button>`).join("")}</div>` : ""}`).join("")
  : `${gDet ? detailHtml(gDet) : '<p class="mute">Tap a flavour to see what it is and where to notice it.</p>'}${GUIDE.map(([n]) => `<h3>${n}</h3><div class="tabs">${SPEC[n].map(x => `<button class="tab ${x === gDet ? "on" : ""}" data-gd="${esc(x)}">${x}</button>`).join("")}</div>`).join("")}`}`;

const coll = () => `<h2>My Tastings</h2><div class="acts" style="margin:10px 0"><button class="btn" data-a="new">+ New Tasting</button><button class="btn ghost" data-v="cmp">Compare</button></div><input class="srch" id="q" type="search" placeholder="Search bottles" value="${esc(q)}">
  <div class="tabs">${TABS.map(c => `<button class="tab ${c === cat ? "on" : ""}" data-c="${c}">${c === "Favourites" ? "♥ Favourites" : c}</button>${c === "Bourbon" ? '<span class="brk"></span>' : ""}`).join("")}</div>
  <div id="list">${listHtml()}</div>`;

function listHtml() {
  const k = q.toLowerCase();
  const rows = notes.filter(n => (cat === "All" || (cat === "Favourites" ? n.favourite : n.category === cat)) && (!k || (n.name + " " + n.distillery).toLowerCase().includes(k))).sort((a, b) => b.updated - a.updated);
  return rows.length ? rows.map(n => `<div class="item"><button class="main" data-id="${n.id}">${n.thumb ? `<img src="${n.thumb}" alt="">` : `<div class="ph"></div>`}
      <span><b>${esc(n.name)}</b><small>${esc(n.category)}${n.region ? " · " + esc(n.region) : ""}${n.abv ? " · " + esc(n.abv) + "%" : ""}</small><br>${stars(n.rating || 0)} <small>${n.rating || ""}</small></span></button>
      ${n.favourite ? '<span class="heart on" aria-label="Favourite">♥</span>' : ""}</div>`).join("")
    : `<p class="empty">${notes.length ? "No bottles match." : "No notes yet. Start with New Tasting on the Home page."}</p>`;
}
const renderList = () => { const l = $("#list"); if (l) l.innerHTML = listHtml(); };

function part(i, ed) {
  const n = draft;
  const fld = (k, l, t = "text", x = "") => (!ed && !getP(n, k)) ? "" : `<label class="fld">${l}<input data-f="${k}" type="${t}" ${x} value="${esc(getP(n, k))}"></label>`;
  const tx = (k, l) => (!ed && !getP(n, k)) ? "" : `<label class="fld">${l}<textarea data-f="${k}">${esc(getP(n, k))}</textarea></label>`;
  if (i === 0) {
    const src = pending || n.thumb;
    const ph = src ? `<img id="pimg" src="${src}" alt="Bottle photo">` : (ed ? "Add bottle photo<br>(tap or drop)" : "No photo");
    const sel = (k, l, opts, nb) => (!ed && !n[k]) ? "" : `<label class="fld">${l}<select data-f="${k}">${nb ? `<option value="">Not set</option>` : ""}${opts.map(o => `<option ${o === n[k] ? "selected" : ""}>${o}</option>`).join("")}</select></label>`;
    return `<div class="top"><label class="photo" id="drop">${ph}<input type="file" id="file" accept="image/*" hidden ${ed ? "" : "disabled"}></label><div class="grid">
      ${fld("name", "Bottle name *")}${fld("distillery", "Distillery")}${sel("category", "Category", CATS)}${sel("type", "Style", TYPES, 1)}
      ${fld("region", "Region", "text", 'list="rg"')}<datalist id="rg">${(REGIONS[n.category] || []).map(r => `<option value="${r}">`).join("")}</datalist>
      ${fld("age", "Age (years)", "number", `inputmode="numeric" ${n.noAge ? "disabled" : ""}`)}${ed || n.noAge ? `<label class="chip"><input type="checkbox" data-f="noAge" ${n.noAge ? "checked" : ""}><span>No age statement</span></label>` : ""}
      ${fld("abv", "ABV %", "number", 'inputmode="decimal" step="0.1"')}${fld("price", "Price")}</div></div>`;
  }
  if (i === STEPS.length - 1) {
    const v = n.rating || 0;
    const r = ed ? `<div class="rate" id="rate">${[1, 2, 3, 4, 5].map(k => `<span class="s ${v >= k ? "f" : v >= k - .5 ? "h" : ""}"><b data-r="${k - .5}"></b><b data-r="${k}"></b>★</span>`).join("")}</div><p class="mute" id="rv">${v ? v + " / 5" : "Tap a star. The left half gives a half star."}</p>`
      : (v ? `<div class="big">${stars(v)} <span class="mute">${v} / 5</span></div>` : "");
    return r + tx("comments", "Overall comments");
  }
  const s = SECTIONS[i - 1];
  const groups = s.g.map(([g, one, items]) => {
    const sl = n.tags[s.k + "|" + g] || [];
    const shown = ed ? items : items.filter(x => sl.includes(x));
    return shown.length ? `<fieldset><legend>${g}</legend><div class="chips">${shown.map(x => `<label class="chip"><input type="checkbox" ${one ? 'data-one="1"' : ""} name="${s.k}|${g}" data-g="${s.k}|${g}" value="${esc(x)}" ${sl.includes(x) ? "checked" : ""}><span>${x}</span></label>`).join("")}</div></fieldset>` : "";
  }).join("");
  return `${ed && s.g.some(([g]) => g.endsWith(" notes")) ? '<button class="btn ghost" type="button" data-a="wopen" style="margin-bottom:10px">Open flavour wheel</button>' : ""}${s.amt ? fld("waterAmt", "Amount of water", "text", 'placeholder="e.g. 3 drops, 1 tsp"') : ""}${groups}${ed ? '<div class="tip" id="tip" hidden></div>' : ""}${s.no ? "" : fld("other." + s.k, "Other descriptors")}${tx("notes." + s.k, "Notes")}`;
}

function noteView() {
  const n = draft, saved = notes.some(x => x.id === n.id), last = STEPS.length - 1;
  if (!editing) {
    const body = STEPS.map((t, i) => { const h = part(i, false); return i === 0 ? h : (h.trim() ? `<div class="sec"><h3>${t}</h3>${h}</div>` : ""); }).join("");
    return `<div class="dhead"><button class="btn ghost" data-v="coll">‹ Tastings</button><span style="display:flex;align-items:center;gap:8px">${n.favourite ? '<span class="heart on" aria-label="Favourite">♥</span>' : ""}<button class="btn" data-a="edit">Edit</button></span></div>
      <h2>${esc(n.name)}</h2><fieldset class="lock" disabled>${body}</fieldset>
      ${saved ? `<div class="acts"><button class="btn danger" data-a="del">Delete</button></div>` : ""}`;
  }
  return `<div class="dhead"><h2>${saved ? "Edit tasting" : "New tasting"}</h2><span style="display:flex;align-items:center;gap:4px"><button class="heart ${n.favourite ? "on" : ""}" type="button" data-favd="1" aria-label="Favourite">♥</button><button class="btn ghost" data-a="cancel">Cancel</button></span></div>
    <div class="tabs">${STEPS.map((t, i) => `<button class="tab ${i === step ? "on" : ""}" data-step="${i}">${t}</button>`).join("")}</div>
    ${step ? `<h3>${STEPS[step]}</h3>` : ""}${part(step, true)}
    <div class="acts pin">${step ? `<button class="btn ghost" data-a="back">Back</button>` : ""}${step < last ? `<button class="btn" data-a="next">Next</button>` : ""}<button class="btn ${step < last ? "ghost" : ""}" data-a="save">Save</button></div>`;
}

function render() {
  $("#page").innerHTML = ({ home, coll, learn, cmp, note: noteView })[view]();
  document.querySelectorAll(".bar button").forEach(b => b.classList.toggle("on", b.dataset.v === (view === "note" ? "coll" : view)));
  if (view === "note" && editing && step === 0) bindPhoto();
  window.scrollTo(0, 0);
}

function bindPhoto() {
  const d = $("#drop");
  d.ondragover = e => { e.preventDefault(); d.classList.add("drag"); };
  d.ondragleave = () => d.classList.remove("drag");
  d.ondrop = e => { e.preventDefault(); d.classList.remove("drag"); if (e.dataTransfer.files[0]) setPhoto(e.dataTransfer.files[0]); };
  $("#file").onchange = e => e.target.files[0] && setPhoto(e.target.files[0]);
}
async function setPhoto(file) {
  try {
    draft.thumb = await shrink(file, 200, 0.7);
    pending = await shrink(file, 800, 0.8);
    $("#drop").innerHTML = `<img id="pimg" src="${pending}" alt="Bottle photo"><input type="file" id="file" accept="image/*" hidden>`;
    $("#file").onchange = e => e.target.files[0] && setPhoto(e.target.files[0]);
  } catch { toast("Could not read that image. Try a JPEG or PNG."); }
}

async function openNote(n, edit) {
  draft = n; editing = edit; pending = null; step = 0; view = "note"; render();
  if (n.thumb && !edit) { const f = await store.photo(n.id); const i = $("#pimg"); if (f && i && draft?.id === n.id) i.src = f; }
}
function paintRate() {
  document.querySelectorAll("#rate .s").forEach((e, k) => { const i = k + 1, v = draft.rating; e.className = "s " + (v >= i ? "f" : v >= i - .5 ? "h" : ""); });
  $("#rv").textContent = draft.rating ? draft.rating + " / 5" : "Tap a star. The left half gives a half star.";
}

const WCOL = { Citrus: "#dcc23e", Fruity: "#d4453f", Sweet: "#eba33a", Spicy: "#e8683a", Woody: "#8a5a3c", Smoky: "#2f6f9a" };
function wheelSvg() {
  const n = CHAR.length, R = 100, r = 34, c = 110, pt = (a, d) => [(c + d * Math.sin(a)).toFixed(1), (c - d * Math.cos(a)).toFixed(1)];
  return `<svg viewBox="0 0 220 220" class="wheel" role="group" aria-label="Flavour wheel">${CHAR.map((f, i) => {
    const a0 = i * 2 * Math.PI / n, a1 = (i + 1) * 2 * Math.PI / n, [x0, y0] = pt(a0, R), [x1, y1] = pt(a1, R), [x2, y2] = pt(a1, r), [x3, y3] = pt(a0, r), [lx, ly] = pt((a0 + a1) / 2, (R + r) / 2 + 4);
    return `<g data-w="${f}" tabindex="0" role="button" aria-label="${f}" opacity="${wSel && wSel !== f ? .4 : 1}"><path d="M${x0} ${y0}A${R} ${R} 0 0 1 ${x1} ${y1}L${x2} ${y2}A${r} ${r} 0 0 0 ${x3} ${y3}Z" fill="${WCOL[f] || "#999"}" stroke="#fbf6ea" stroke-width="2"/><text x="${lx}" y="${ly}" text-anchor="middle" font-size="11" font-weight="600" fill="${f === "Sweet" || f === "Citrus" ? "#3b2417" : "#fff"}">${f}</text></g>`;
  }).join("")}<circle cx="${c}" cy="${c}" r="${r - 4}" fill="#fbf6ea"/><text x="${c}" y="${c + 4}" text-anchor="middle" font-size="10" fill="#3b2417">Flavours</text></svg>`;
}
const wheelPage = () => `<p class="mute">Tap a slice to explore its flavours, then tap a flavour to learn about it.</p>${wheelSvg()}${wSel ? `<h3>${wSel}</h3><p>${GUIDE.find(x => x[0] === wSel)?.[1] || ""}</p><div class="tabs">${SPEC[wSel].map(x => `<button class="tab" data-gd="${esc(x)}">${x}</button>`).join("")}</div>` : ""}`;
function paintWheel() {
  const o = $("#wheelov"); o.hidden = !wOn; if (!wOn) return;
  const sec = SECTIONS[step - 1], hasC = sec.g.some(g => g[0] === "Character");
  const chip = (g, v, l) => `<button class="tab ${(draft.tags[sec.k + "|" + g] || []).includes(v) ? "on" : ""}" data-wp="${g}" data-wv="${esc(v)}">${l}</button>`;
  o.innerHTML = `<div class="page"><h2>${sec.t}: flavour wheel</h2><p class="mute">Tap a slice, then pick anything that fits. Every pick is optional.</p><div class="wdone"><button class="btn" data-a="wdone">Done</button></div>${wheelSvg()}${wSel ? `<h3>${wSel}</h3>${hasC ? `<small class="mute">Broad</small><div class="tabs">${chip("Character", wSel, "Any " + wSel.toLowerCase())}</div><div class="mute" style="text-align:center" aria-hidden="true">–</div>` : ""}<small class="mute">Specific</small><div class="tabs">${SPEC[wSel].map(x => chip(wSel + " notes", x, x)).join("")}</div>` : ""}</div>`;
}
const flv = (n, k) => Object.entries(n.tags || {}).filter(([g]) => g.startsWith(k + "|") && (g.endsWith("|Character") || g.endsWith(" notes"))).flatMap(([, v]) => v);
const pills = (a, c) => a.length ? a.map(x => `<span class="pill ${c}">${esc(x)}</span>`).join("") : '<small class="mute">None</small>';
function cmpHtml(A, B) {
  const sec = (k, t) => { const a = [...new Set(flv(A, k))], b = [...new Set(flv(B, k))]; return `<div class="sec"><h3>${t}</h3><small>In common</small><div>${pills(a.filter(x => b.includes(x)), "sh")}</div><small>Only ${esc(A.name)}</small><div>${pills(a.filter(x => !b.includes(x)), "")}</div><small>Only ${esc(B.name)}</small><div>${pills(b.filter(x => !a.includes(x)), "")}</div></div>`; };
  const all = n => new Set([...flv(n, "nose"), ...flv(n, "taste")]), a = all(A), b = all(B), u = new Set([...a, ...b]), sh = [...a].filter(x => b.has(x)).length;
  const pct = u.size ? Math.round(100 * sh / u.size) : null;
  const rows = [["Rating", n => n.rating ? stars(n.rating) + " " + n.rating : "–"], ["Category", n => esc(n.category)], ["Region", n => esc(n.region) || "–"], ["Style", n => esc(n.type) || "–"], ["Age", n => n.noAge ? "No age statement" : n.age ? n.age + " years" : "–"], ["ABV", n => n.abv ? esc(n.abv) + "%" : "–"], ["Finish", n => (n.tags?.["finish|Length"] || []).join(", ") || "–"]];
  return `<div class="row card"><b>Flavour match</b><div class="big">${pct === null ? "–" : pct + "%"}</div><small>${pct === null ? "No Nose or Taste flavours recorded yet." : sh + " of " + u.size + " Nose and Taste flavours in common."}</small></div>
  <div class="cmp"><b></b><b>${esc(A.name)}</b><b>${esc(B.name)}</b>${rows.map(([l, f]) => `<span class="mute">${l}</span><span>${f(A)}</span><span>${f(B)}</span>`).join("")}</div>${sec("nose", "Nose")}${sec("taste", "Taste")}${sec("finish", "Finish")}`;
}
const cmp = () => {
  const o = v => `<option value="">Choose a bottle</option>${[...notes].sort((x, y) => x.name.localeCompare(y.name)).map(n => `<option value="${n.id}" ${n.id === v ? "selected" : ""}>${esc(n.name)}</option>`).join("")}`;
  const A = notes.find(n => n.id === cA), B = notes.find(n => n.id === cB);
  return `<h2>Compare</h2><div class="grid"><label class="fld">Bottle 1<select data-cmp="A">${o(cA)}</select></label><label class="fld">Bottle 2<select data-cmp="B">${o(cB)}</select></label></div>
  ${notes.length < 2 ? '<p class="empty">Add at least two bottles to compare them.</p>' : A && B ? (A.id === B.id ? '<p class="empty">Choose two different bottles.</p>' : cmpHtml(A, B)) : '<p class="empty">Choose two bottles to compare.</p>'}`;
};

function onClick(e) {
  const t = e.target;
  if (t.closest("#tip")) { t.closest("#tip").hidden = true; return; }
  const r = t.closest("[data-r]");
  if (r && editing) { const v = +r.dataset.r; draft.rating = draft.rating === v ? 0 : v; paintRate(); return; }
  const f = t.closest("[data-favd]"); if (f && editing) { draft.favourite = !draft.favourite; f.classList.toggle("on", draft.favourite); return; }
  const gt = t.closest("[data-gt]"); if (gt) { gTab = gt.dataset.gt; render(); return; }
  const gc = t.closest("[data-gc]"); if (gc) { const y = scrollY; gSel = gSel === gc.dataset.gc ? null : gc.dataset.gc; render(); scrollTo(0, y); return; }
  const gd = t.closest("[data-gd]"); if (gd) { const x = gd.dataset.gd, was = gTab; gTab = "ex"; gDet = (was === "ex" && gDet === x) ? null : x; render(); return; }
  const gw = t.closest("[data-w]"); if (gw) { wSel = wSel === gw.dataset.w ? null : gw.dataset.w; if (wOn) paintWheel(); else { const y = scrollY; render(); scrollTo(0, y); } return; }
  const wp = t.closest("[data-wp]"); if (wp) { const k = SECTIONS[step - 1].k + "|" + wp.dataset.wp, v = wp.dataset.wv, cur = draft.tags[k] || []; draft.tags[k] = cur.includes(v) ? cur.filter(x => x !== v) : [...cur, v]; paintWheel(); return; }
  const id = t.closest("[data-id]")?.dataset.id;
  if (id) { openNote({ ...blank(), ...structuredClone(notes.find(n => n.id === id)) }, false); return; }
  const c = t.closest("[data-c]"); if (c) { cat = c.dataset.c; render(); return; }
  const v = t.closest("[data-v]");
  if (v) { if (editing && !confirm("Discard unsaved changes?")) return; editing = false; view = v.dataset.v; if (view !== "note") draft = null; render(); return; }
  const sp = t.closest("[data-step]"); if (sp) { step = +sp.dataset.step; render(); return; }
  const a = t.closest("[data-a]")?.dataset.a;
  if (a === "new") openNote(blank(), true);
  if (a === "wopen") { wOn = true; wSel = null; paintWheel(); }
  if (a === "wdone") { wOn = false; paintWheel(); const y = scrollY; render(); scrollTo(0, y); }
  if (a === "out") fb.signOut(auth);
  if (a === "back") { step--; render(); }
  if (a === "next") { step++; render(); }
  if (a === "edit") { editing = true; step = 0; render(); }
  if (a === "cancel") {
    if (!confirm("Discard unsaved changes?")) return;
    const o = notes.find(n => n.id === draft.id);
    if (o) openNote({ ...blank(), ...structuredClone(o) }, false); else { draft = null; editing = false; view = "coll"; render(); }
  }
  if (a === "save") {
    if (!draft.name.trim()) { toast("Add a bottle name first"); step = 0; render(); return; }
    draft.updated = Date.now();
    store.save(draft, pending);
    const copy = structuredClone(draft), i = notes.findIndex(n => n.id === draft.id);
    if (i < 0) notes.push(copy); else notes[i] = copy;
    toast("Saved"); openNote(structuredClone(copy), false);
  }
  if (a === "del" && confirm("Delete this note? This cannot be undone.")) {
    store.del(draft.id); notes = notes.filter(n => n.id !== draft.id);
    draft = null; editing = false; view = "coll"; render(); toast("Deleted");
  }
}

function tip(v) {
  const e = $("#tip"); if (!e) return;
  const g = GUIDE.find(x => x[0] === v), d = DETAIL[v];
  e.innerHTML = g ? `<b>${esc(v)}</b><br>${g[1]}<br><small>e.g. ${SPEC[v].join(", ").toLowerCase()}</small>` : d ? `<b>${esc(v)}</b><br>${d[0]}<br><small>Where you might notice it: ${d[1]}</small>` : "";
  e.hidden = !e.innerHTML;
}
function onInput(e) {
  const t = e.target;
  if (t.id === "q") { q = t.value; renderList(); return; }
  if (t.dataset.cmp) { t.dataset.cmp === "A" ? cA = t.value : cB = t.value; const y = scrollY; render(); scrollTo(0, y); return; }
  if (!editing) return;
  if (t.dataset.g) {
    if (t.dataset.one && t.checked) document.querySelectorAll(`[data-g="${t.dataset.g}"]`).forEach(i => { if (i !== t) i.checked = false; });
    draft.tags[t.dataset.g] = [...document.querySelectorAll(`[data-g="${t.dataset.g}"]:checked`)].map(i => i.value); tip(t.checked ? t.value : ""); return; }
  const f = t.dataset.f; if (!f) return;
  setP(draft, f, t.type === "checkbox" ? t.checked : t.value);
  if (f === "noAge") { const a = document.querySelector('[data-f="age"]'); a.disabled = t.checked; if (t.checked) { a.value = ""; draft.age = ""; } }
  if (f === "category") $("#rg").innerHTML = (REGIONS[t.value] || []).map(r => `<option value="${r}">`).join("");
}
$("#root").addEventListener("click", onClick);
$("#root").addEventListener("input", onInput);
$("#root").addEventListener("change", onInput);
$("#root").addEventListener("keydown", e => { if ((e.key === "Enter" || e.key === " ") && e.target.dataset?.w) { e.preventDefault(); e.target.dispatchEvent(new MouseEvent("click", { bubbles: true })); } });

function start() {
  view = "home"; draft = null; editing = false;
  $("#root").innerHTML = `<main class="page" id="page"></main><nav class="bar">${[["home", "Home"], ["coll", "Tastings"], ["learn", "Learn"]].map(([v, l]) => `<button data-v="${v}">${l}</button>`).join("")}</nav><div class="ov" id="wheelov" hidden></div>`;
  render();
  unsub?.();
  unsub = store.listen(list => { notes = list; if (view === "coll") renderList(); else if (view === "home" || view === "cmp") render(); });
}

/* ---------- Boot ---------- */
if (LOCAL) start();
else {
  const authErr = c => ({
    "auth/invalid-credential": "Wrong email or password.",
    "auth/invalid-email": "That email address is not valid.",
    "auth/weak-password": "Use a password of at least 6 characters.",
    "auth/operation-not-allowed": "Email and password sign-in is turned off in Firebase.",
    "auth/too-many-requests": "Too many attempts. Wait a few minutes and try again."
  }[c] || "Sign-in failed. Check your connection and try again.");
  fb.onAuthStateChanged(auth, u => {
    if (u) { start(); return; }
    unsub?.(); unsub = null; notes = []; draft = null;
    $("#root").innerHTML = `<form class="login" id="lf"><h1>Whisky Notes</h1><small class="ver">v${VERSION}</small>
      <label class="fld">Email<input id="em" type="email" autocomplete="username"></label>
      <label class="fld">Password<input id="pw" type="password" autocomplete="current-password"></label>
      <p class="err" id="err" role="alert"></p>
      <div class="acts"><button class="btn" type="submit">Sign in</button></div></form>`;
    const go = async make => {
      const em = $("#em").value.trim(), pw = $("#pw").value;
      if (!em || !pw) { $("#err").textContent = "Enter your email and password."; return; }
      try { await make(auth, em, pw); } catch (e) { $("#err").textContent = authErr(e.code); }
    };
    $("#lf").onsubmit = e => { e.preventDefault(); go(fb.signInWithEmailAndPassword); };
  });
}
</script>
</body>
</html>
