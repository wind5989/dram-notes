<!doctype html>
<!-- Dram Notes v2.2 -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Dram Notes v2.2</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Figtree:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#14211d;--panel:#1b2c27;--line:#2e443d;--ink:#efe6d4;--mute:#9bab9f;--amber:#e0953a;--amber-ink:#1a1206;--r:10px}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.45 Figtree,system-ui,sans-serif;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
h1,h2{font-family:Fraunces,Georgia,serif;margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.app{display:grid;grid-template-columns:350px 1fr;height:100%}
.list{border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.lhead{padding:16px 16px 8px;display:flex;justify-content:space-between;align-items:center}
.lhead h1{font-size:26px}
.btn{background:var(--amber);color:var(--amber-ink);border:0;border-radius:var(--r);padding:10px 16px;font-weight:600;min-height:44px}
.btn.ghost{background:none;color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:none;color:#e58b7a;border:1px solid #5a3a35}
.tabs{display:flex;flex-wrap:wrap;gap:6px;padding:4px 16px 12px}
.brk{flex-basis:100%;height:0}
.tab{flex:none;background:none;border:1px solid var(--line);border-radius:99px;padding:6px 14px;color:var(--mute);min-height:36px}
.tab.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.items{overflow-y:auto;flex:1;padding:0 8px 16px}
.item{display:flex;gap:12px;width:100%;text-align:left;background:none;border:0;border-radius:var(--r);padding:8px;align-items:center}
.item:hover,.item.on{background:var(--panel)}
.item img,.ph{width:56px;height:72px;border-radius:6px;object-fit:cover;background:var(--line);flex:none}
.item b{display:block;font-family:Fraunces,Georgia,serif;font-weight:500}
.item small{color:var(--mute)}
.stars{color:var(--amber);letter-spacing:2px}
.empty{color:var(--mute);padding:24px 16px}
.detail{overflow-y:auto;min-height:0;padding:20px 24px 48px}
.form{max-width:900px;margin:0 auto}
.dhead{display:flex;gap:12px;align-items:center;margin-bottom:16px}
.dhead h2{font-size:28px;flex:1}
.back{display:none}
.top{display:grid;grid-template-columns:160px 1fr;gap:20px}
.photo{aspect-ratio:3/4;border:1px dashed var(--line);border-radius:var(--r);display:grid;place-items:center;text-align:center;color:var(--mute);cursor:pointer;overflow:hidden;position:relative;padding:8px}
.photo.drag{border-color:var(--amber)}
.photo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}
.fld{display:block;color:var(--mute);font-size:14px}
.fld input,.fld select,.fld textarea{display:block;width:100%;margin-top:4px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px;font-size:16px;color:var(--ink)}
.fld textarea{min-height:72px;resize:vertical}
.sec{border-top:1px solid var(--line);margin-top:16px;padding-top:8px}
.sec summary{font-family:Fraunces,Georgia,serif;font-size:21px;padding:8px 0;cursor:pointer}
fieldset{border:0;padding:0;margin:8px 0 12px}
legend{color:var(--mute);font-size:14px;padding:0;margin-bottom:6px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip input{position:absolute;opacity:0;pointer-events:none}
.chip span{display:inline-block;border:1px solid var(--line);border-radius:99px;padding:9px 14px;min-height:44px;line-height:24px;cursor:pointer;user-select:none}
.chip input:checked+span{background:var(--amber);border-color:var(--amber);color:var(--amber-ink);font-weight:600}
.chip input:focus-visible+span{outline:2px solid var(--ink)}
.rate{display:flex;gap:2px;margin:8px 0}
.rate button{background:none;border:0;font-size:36px;color:var(--line);padding:0 4px;min-width:44px;min-height:44px}
.rate button.on{color:var(--amber)}
.acts{display:flex;gap:12px;margin-top:24px}
.acts .btn:first-child{flex:1}
.none{display:grid;place-items:center;height:100%;color:var(--mute);text-align:center;padding:24px}
.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:99px;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
.login{display:grid;justify-items:center;height:100%;text-align:center;gap:14px;align-content:center;max-width:340px;margin:0 auto;padding:0 16px}
.login .fld{width:100%;text-align:left}
.login .acts{width:100%}
.err{color:#e58b7a;min-height:1.4em;margin:0}
.foot{padding:8px 16px;border-top:1px solid var(--line)}
.login h1{font-size:40px}
.lock{border:0;margin:0;padding:0;min-width:0}
.lock[disabled] input,.lock[disabled] select,.lock[disabled] textarea{color:var(--ink);opacity:1;-webkit-text-fill-color:var(--ink);border-color:transparent;background:var(--panel)}
.lock[disabled] .rate button{color:var(--line)}
.lock[disabled] .rate button.on{color:var(--amber)}
.ver{font:12px Figtree,system-ui,sans-serif;color:var(--mute)}
@media(max-width:700px){
 .app{grid-template-columns:1fr}
 .detail{display:none;padding:12px 16px 48px}
 .app.open .list{display:none}
 .app.open .detail{display:block}
 .back{display:inline-block}
 .top{grid-template-columns:110px 1fr}
 .dhead h2{font-size:22px}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="root"></div>
<div class="toast" id="toast"></div>
<script type="module">
/* ---------- 1. Paste your Firebase web app config here. Until then the app runs in local test mode. ---------- */
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyBbdIody6lDgrP5UzQDt7SFt-g1cLGazJA",
  authDomain: "whiskey-notes-513ed.firebaseapp.com",
  projectId: "whiskey-notes-513ed",
  storageBucket: "whiskey-notes-513ed.firebasestorage.app",
  messagingSenderId: "365703540348",
  appId: "1:365703540348:web:626da1915b95fd2b0623f9"
};


/* ---------- 2. Descriptor lists. Edit freely. ---------- */
const CATS = ["Scotch", "Irish", "Bourbon", "Rye", "Other"];
const CHAR = ["Sweet", "Spicy", "Fruity", "Smoky", "Grainy"];
const SECTIONS = [
  { k: "appearance", t: "Appearance", g: [["Color", 1, ["Pale straw", "Gold", "Amber", "Copper", "Mahogany"]], ["Viscosity", 1, ["Thin", "Medium", "Oily"]]] },
  { k: "nose", t: "Nose", g: [["Character", 0, CHAR]] },
  { k: "taste", t: "Taste", g: [["Character", 0, CHAR]] },
  { k: "finish", t: "Finish", no: 1, g: [["Length", 1, ["Short", "Medium", "Long"]]] },
  { k: "water", t: "Water", no: 1, amt: 1, g: [["Effect on aroma", 0, ["Opened up", "Softer", "Muted", "No change"]], ["Effect on taste", 0, ["Sweeter", "Spicier", "Smoother", "Flatter", "No change"]]] }
];

/* ---------- Storage: Firebase, or localStorage for testing ---------- */
const LOCAL = FIREBASE_CONFIG.apiKey.startsWith("PASTE");
const ls = k => JSON.parse(localStorage.getItem(k) || "{}");
let store, auth, fb, unsub;

if (LOCAL) {
  store = {
    listen(cb) { this.cb = cb; cb(Object.values(ls("dn_notes"))); },
    async save(n, photo) {
      const a = ls("dn_notes"); a[n.id] = n; localStorage.setItem("dn_notes", JSON.stringify(a));
      if (photo) { const p = ls("dn_photos"); p[n.id] = photo; localStorage.setItem("dn_photos", JSON.stringify(p)); }
      this.cb(Object.values(a));
    },
    async del(id) {
      const a = ls("dn_notes"); delete a[id]; localStorage.setItem("dn_notes", JSON.stringify(a));
      this.cb(Object.values(a));
    },
    async photo(id) { return ls("dn_photos")[id] || null; }
  };
} else {
  const V = "10.12.2", B = "https://www.gstatic.com/firebasejs/" + V + "/";
  const [app, au, fs] = await Promise.all([import(B + "firebase-app.js"), import(B + "firebase-auth.js"), import(B + "firebase-firestore.js")]);
  fb = au;
  const a = app.initializeApp(FIREBASE_CONFIG);
  auth = au.getAuth(a);
  const db = fs.initializeFirestore(a, { localCache: fs.persistentLocalCache({ tabManager: fs.persistentMultipleTabManager() }) });
  const col = n => fs.collection(db, "users", auth.currentUser.uid, n);
  // Writes are not awaited: offline, the promise only resolves once the server confirms.
  store = {
    listen(cb) { return fs.onSnapshot(col("notes"), s => cb(s.docs.map(d => d.data()))); },
    async save(n, photo) {
      fs.setDoc(fs.doc(col("notes"), n.id), n).catch(console.error);
      if (photo) fs.setDoc(fs.doc(col("photos"), n.id), { data: photo }).catch(console.error);
    },
    async del(id) {
      fs.deleteDoc(fs.doc(col("notes"), id)).catch(console.error);
      fs.deleteDoc(fs.doc(col("photos"), id)).catch(console.error);
    },
    async photo(id) { const d = await fs.getDoc(fs.doc(col("photos"), id)); return d.exists() ? d.data().data : null; }
  };
}

/* ---------- State and helpers ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const VERSION = "2.2";
let notes = [], cat = "All", draft = null, pending = null, editing = false;

const blank = () => ({ id: crypto.randomUUID(), name: "", distillery: "", category: "Scotch", age: "", abv: "", price: "", waterAmt: "", tags: {}, other: {}, notes: {}, rating: 0, comments: "", thumb: "", updated: 0 });
const getP = (o, p) => p.split(".").reduce((a, k) => a?.[k], o);
const setP = (o, p, v) => { const ks = p.split("."), l = ks.pop(); ks.reduce((a, k) => a[k], o)[l] = v; };
const stars = n => "★".repeat(n) + "☆".repeat(5 - n);
function toast(t) { const e = $("#toast"); e.textContent = t; e.classList.add("show"); setTimeout(() => e.classList.remove("show"), 1800); }

async function shrink(file, max, q) {
  const b = await createImageBitmap(file, { imageOrientation: "from-image" });
  const s = Math.min(1, max / Math.max(b.width, b.height));
  const c = document.createElement("canvas");
  c.width = Math.round(b.width * s); c.height = Math.round(b.height * s);
  c.getContext("2d").drawImage(b, 0, 0, c.width, c.height);
  return c.toDataURL("image/jpeg", q);
}

/* ---------- Rendering ---------- */
function shell() {
  $("#root").innerHTML = `<div class="app" id="app">
    <section class="list">
      <div class="lhead"><h1>Dram Notes <small class="ver">v${VERSION}</small></h1><button class="btn" id="new">New note</button></div>
      <div class="tabs" id="tabs"></div>
      <div class="items" id="items"></div>
      ${LOCAL ? "" : `<div class="foot"><button class="btn ghost" id="out">Sign out</button></div>`}
    </section>
    <section class="detail" id="detail"></section></div>`;
  $("#new").onclick = () => open(blank(), true);
  $("#tabs").onclick = e => { const t = e.target.closest("[data-c]"); if (t) { cat = t.dataset.c; renderList(); } };
  $("#items").onclick = e => { const t = e.target.closest("[data-id]"); if (t) open({ ...blank(), ...structuredClone(notes.find(n => n.id === t.dataset.id)) }); };
  $("#detail").addEventListener("input", onEdit);
  $("#detail").addEventListener("change", onEdit);
  $("#detail").addEventListener("click", onClick);
  $("#out")?.addEventListener("click", () => fb.signOut(auth));
  renderList(); renderDetail();
}

function renderList() {
  $("#tabs").innerHTML = ["All", ...CATS].map(c => `<button class="tab ${c === cat ? "on" : ""}" data-c="${c}">${c}</button>${c === "Bourbon" ? '<span class="brk"></span>' : ""}`).join("");
  const rows = notes.filter(n => cat === "All" || n.category === cat).sort((a, b) => b.updated - a.updated);
  $("#items").innerHTML = rows.length ? rows.map(n => `<button class="item ${draft?.id === n.id ? "on" : ""}" data-id="${n.id}">
      ${n.thumb ? `<img src="${n.thumb}" alt="">` : `<div class="ph"></div>`}
      <span><b>${esc(n.name)}</b><small>${esc(n.distillery)}${n.distillery && n.category ? ", " : ""}${esc(n.category)}</small><br><span class="stars">${stars(n.rating || 0)}</span></span></button>`).join("")
    : `<p class="empty">${cat === "All" ? "No notes yet. Select New note to log your first bottle." : "No " + cat + " notes yet."}</p>`;
}

async function open(n, edit = false) {
  draft = n; editing = edit; pending = null;
  renderDetail(); renderList();
  $("#app").classList.add("open");
  if (n.thumb) { const full = await store.photo(n.id); if (full && draft?.id === n.id) { const i = $("#pimg"); if (i) i.src = full; } }
}

function renderDetail() {
  const d = $("#detail");
  if (!draft) { d.innerHTML = `<div class="none"><p>Select a note or create a new one.</p></div>`; return; }
  const n = draft, ed = editing, saved = notes.some(x => x.id === n.id);
  const fld = (k, l, t = "text", extra = "") => (!ed && !getP(n, k)) ? "" : `<label class="fld">${l}<input data-f="${k}" type="${t}" ${extra} value="${esc(getP(n, k))}"></label>`;
  const tx = (k, l) => (!ed && !getP(n, k)) ? "" : `<label class="fld">${l}<textarea data-f="${k}">${esc(getP(n, k))}</textarea></label>`;
  const sec = (s, i) => {
    const groups = s.g.map(([g, one, items]) => {
      const sel = n.tags[s.k + "|" + g] || [];
      const shown = ed ? items : items.filter(x => sel.includes(x));
      return shown.length ? `<fieldset><legend>${g}</legend><div class="chips">${shown.map(x => `<label class="chip"><input type="${one ? "radio" : "checkbox"}" name="${s.k}|${g}" data-g="${s.k}|${g}" value="${esc(x)}" ${sel.includes(x) ? "checked" : ""}><span>${x}</span></label>`).join("")}</div></fieldset>` : "";
    }).join("");
    return `<details class="sec" ${ed ? (i === 0 ? "open" : "") : "open"}><summary>${s.t}</summary>${s.amt ? fld("waterAmt", "Amount of water", "text", 'placeholder="e.g. 3 drops, 1 tsp"') : ""}${groups}${s.no ? "" : fld("other." + s.k, "Other descriptors")}${tx("notes." + s.k, "Notes")}</details>`;
  };
  const photo = n.thumb ? `<img id="pimg" src="${n.thumb}" alt="Bottle photo">` : (ed ? "Add bottle photo<br>(tap or drop a file)" : "No photo");
  d.innerHTML = `<div class="form">
    <div class="dhead"><button class="btn ghost back" data-a="back">Back</button><h2>${esc(n.name) || "New note"}</h2></div>
    <fieldset class="lock" ${ed ? "" : "disabled"}>
    <div class="top">
      <label class="photo" id="drop">${photo}<input type="file" id="file" accept="image/*" hidden ${ed ? "" : "disabled"}></label>
      <div class="grid">
        ${fld("name", "Bottle name")}${fld("distillery", "Distillery")}
        <label class="fld">Category<select data-f="category">${CATS.map(c => `<option ${c === n.category ? "selected" : ""}>${c}</option>`).join("")}</select></label>
        ${fld("age", "Age (years)", "number", 'inputmode="numeric"')}${fld("abv", "ABV %", "number", 'inputmode="decimal" step="0.1"')}${fld("price", "Price", "text")}
      </div>
    </div>
    ${SECTIONS.map(sec).join("")}
    <details class="sec" open><summary>Rating</summary>
      <div class="rate" id="rate">${[1, 2, 3, 4, 5].map(i => `<button type="button" data-star="${i}" class="${i <= n.rating ? "on" : ""}" aria-label="${i} star${i > 1 ? "s" : ""}">★</button>`).join("")}</div>
      ${tx("comments", "Overall comments")}</details>
    </fieldset>
    <div class="acts">${ed
      ? `<button class="btn" data-a="save">Save note</button><button class="btn ghost" data-a="cancel">Cancel</button>`
      : `<button class="btn" data-a="edit">Edit note</button>${saved ? `<button class="btn danger" data-a="del">Delete</button>` : ""}`}</div></div>`;
  if (ed) {
    const drop = $("#drop");
    drop.ondragover = e => { e.preventDefault(); drop.classList.add("drag"); };
    drop.ondragleave = () => drop.classList.remove("drag");
    drop.ondrop = e => { e.preventDefault(); drop.classList.remove("drag"); if (e.dataTransfer.files[0]) setPhoto(e.dataTransfer.files[0]); };
    $("#file").onchange = e => e.target.files[0] && setPhoto(e.target.files[0]);
  }
}

async function setPhoto(file) {
  try {
    draft.thumb = await shrink(file, 200, 0.7);
    pending = await shrink(file, 800, 0.8);
    $("#drop").innerHTML = `<img id="pimg" src="${pending}" alt="Bottle photo"><input type="file" id="file" accept="image/*" hidden>`;
    $("#file").onchange = e => e.target.files[0] && setPhoto(e.target.files[0]);
  } catch { toast("Could not read that image. Try a JPEG or PNG."); }
}

function onEdit(e) {
  if (!editing) return;
  const t = e.target;
  if (t.dataset.g) {
    draft.tags[t.dataset.g] = [...document.querySelectorAll(`[data-g="${t.dataset.g}"]:checked`)].map(i => i.value);
  } else if (t.dataset.f) setP(draft, t.dataset.f, t.value);
}

function onClick(e) {
  const s = e.target.closest("[data-star]");
  if (s) {
    if (!editing) return;
    const v = +s.dataset.star;
    draft.rating = draft.rating === v ? 0 : v;
    document.querySelectorAll("[data-star]").forEach(b => b.classList.toggle("on", +b.dataset.star <= draft.rating));
    return;
  }
  const a = e.target.closest("[data-a]")?.dataset.a;
  if (a === "back") $("#app").classList.remove("open");
  if (a === "edit") { editing = true; renderDetail(); }
  if (a === "cancel") {
    const orig = notes.find(n => n.id === draft.id);
    if (orig) open({ ...blank(), ...structuredClone(orig) });
    else { draft = null; editing = false; renderDetail(); renderList(); $("#app").classList.remove("open"); }
  }
  if (a === "save") {
    if (!draft.name.trim()) { toast("Add a bottle name first"); return; }
    draft.updated = Date.now();
    store.save(draft, pending);
    const copy = structuredClone(draft), i = notes.findIndex(n => n.id === draft.id);
    if (i < 0) notes.push(copy); else notes[i] = copy;
    toast("Saved"); renderList(); open(structuredClone(copy));
  }
  if (a === "del" && confirm("Delete this note? This cannot be undone.")) {
    store.del(draft.id); notes = notes.filter(n => n.id !== draft.id);
    draft = null; renderDetail(); renderList(); $("#app").classList.remove("open"); toast("Deleted");
  }
}

function start() {
  shell();
  unsub?.();
  unsub = store.listen(list => { notes = list; renderList(); });
}

/* ---------- Boot ---------- */
if (LOCAL) start();
else {
  const authErr = c => ({
    "auth/invalid-credential": "Wrong email or password.",
    "auth/invalid-email": "That email address is not valid.",
    "auth/email-already-in-use": "An account with that email already exists. Sign in instead.",
    "auth/weak-password": "Use a password of at least 6 characters.",
    "auth/operation-not-allowed": "Email and password sign-in is not enabled in Firebase.",
    "auth/too-many-requests": "Too many attempts. Wait a few minutes and try again."
  }[c] || "Sign-in failed. Check your connection and try again.");
  fb.onAuthStateChanged(auth, u => {
    if (u) { start(); return; }
    unsub?.(); unsub = null; notes = []; draft = null;
    $("#root").innerHTML = `<form class="login" id="lf"><h1>Dram Notes</h1><small class="ver">v${VERSION}</small>
      <label class="fld">Email<input id="em" type="email" autocomplete="username"></label>
      <label class="fld">Password<input id="pw" type="password" autocomplete="current-password"></label>
      <p class="err" id="err" role="alert"></p>
      <div class="acts"><button class="btn" type="submit">Sign in</button><button class="btn ghost" type="button" id="mk">Create account</button></div></form>`;
    const go = async make => {
      const em = $("#em").value.trim(), pw = $("#pw").value;
      if (!em || !pw) { $("#err").textContent = "Enter your email and password."; return; }
      try { await make(auth, em, pw); } catch (e) { $("#err").textContent = authErr(e.code); }
    };
    $("#lf").onsubmit = e => { e.preventDefault(); go(fb.signInWithEmailAndPassword); };
    $("#mk").onclick = () => go(fb.createUserWithEmailAndPassword);
  });
}
</script>
</body>
</html>
