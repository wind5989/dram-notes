<!doctype html>
<!-- Dram Notes v3.0 -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Dram Notes v3.0</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Figtree:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f1e6d2;--panel:#fbf6ea;--line:#dcc9aa;--ink:#3b2417;--mute:#85705a;--brown:#7a3d1c;--amber:#e3a03a;--cream:#f7eddb;--r:12px}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font:16px/1.45 Figtree,system-ui,sans-serif;padding-top:env(safe-area-inset-top)}
h1,h2,h3{font-family:Fraunces,Georgia,serif;margin:0;font-weight:600}
h2{font-size:26px}h3{font-size:21px;margin:4px 0 10px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--brown);outline-offset:2px}
.page{max-width:760px;margin:0 auto;padding:16px 16px calc(90px + env(safe-area-inset-bottom))}
.bar{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--panel);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:5}
.bar button{flex:1;background:none;border:0;min-height:56px;color:var(--mute);font-weight:600}
.bar button.on{color:var(--brown);box-shadow:inset 0 3px var(--brown)}
.btn{background:var(--brown);color:var(--cream);border:0;border-radius:var(--r);padding:12px 18px;font-weight:600;min-height:48px}
.btn.ghost{background:none;color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:none;color:#a2392b;border:1px solid #d9a79c}
.hero{background:linear-gradient(160deg,#3a2012,#6b3519);color:var(--cream);border-radius:20px;padding:28px 20px;margin-bottom:16px}
.hero h1{font-size:34px}.hero p{margin:4px 0 20px;color:#d9bf9c}
.hero .btn{background:var(--cream);color:var(--brown);width:100%;font-size:18px}
.row{display:flex;justify-content:space-between;align-items:center;width:100%;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;margin-bottom:10px;text-align:left}
.row small,.mute,.item small{color:var(--mute)}
.card{display:block}
.srch{width:100%;margin:10px 0 4px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px;font-size:16px}
.tabs{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.tab{background:none;border:1px solid var(--line);border-radius:99px;padding:6px 14px;color:var(--mute);min-height:38px}
.tab.on{background:var(--brown);border-color:var(--brown);color:var(--cream)}
.brk{flex-basis:100%;height:0}
.item{display:flex;gap:4px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:10px;margin-bottom:10px}
.main{display:flex;gap:12px;flex:1;min-width:0;background:none;border:0;text-align:left;align-items:center;padding:0}
.item img,.ph{width:56px;height:72px;border-radius:8px;object-fit:cover;background:var(--line);flex:none}
.item b{display:block;font-family:Fraunces,Georgia,serif}
.heart{background:none;border:0;font-size:26px;color:var(--line);min-width:44px;min-height:44px}
.heart.on{color:#c0392b}
.s{display:inline-block;position:relative;color:var(--line)}
.s.f{color:var(--amber)}
.s.h{background:linear-gradient(90deg,var(--amber) 50%,var(--line) 50%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.stars{letter-spacing:1px}
.rate{display:flex;margin:8px 0}
.rate .s{font-size:40px;width:44px;height:44px;line-height:44px;text-align:center}
.rate b{position:absolute;top:0;bottom:0;width:50%;cursor:pointer}
.rate b:first-child{left:0}.rate b:last-child{right:0}
.big{font-size:30px;margin:6px 0}
.dhead{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:8px}
.top{display:grid;grid-template-columns:150px 1fr;gap:16px;margin:12px 0}
.photo{aspect-ratio:3/4;border:1px dashed var(--line);border-radius:var(--r);display:grid;place-items:center;text-align:center;color:var(--mute);cursor:pointer;overflow:hidden;position:relative;padding:8px}
.photo.drag{border-color:var(--brown)}
.photo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;align-content:start}
.fld{display:block;color:var(--mute);font-size:14px;margin-bottom:10px}
.grid .fld{margin:0}
.fld input,.fld select,.fld textarea{display:block;width:100%;margin-top:4px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px;font-size:16px;color:var(--ink)}
.fld textarea{min-height:72px;resize:vertical}
.sec{border-top:1px solid var(--line);margin-top:14px;padding-top:10px}
.lock{border:0;margin:0;padding:0;min-width:0}
.lock[disabled] input,.lock[disabled] select,.lock[disabled] textarea{color:var(--ink);opacity:1;-webkit-text-fill-color:var(--ink);border-color:transparent;background:var(--panel)}
fieldset{border:0;padding:0;margin:8px 0 12px}
legend{color:var(--mute);font-size:14px;padding:0;margin-bottom:6px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip input{position:absolute;opacity:0;pointer-events:none}
.chip span{display:inline-block;border:1px solid var(--line);border-radius:99px;padding:9px 14px;min-height:44px;line-height:24px;cursor:pointer;user-select:none;background:var(--panel)}
.chip input:checked+span{background:var(--brown);border-color:var(--brown);color:var(--cream);font-weight:600}
.chip input:focus-visible+span{outline:2px solid var(--ink)}
.acts{display:flex;gap:12px;margin-top:22px}
.acts .btn{flex:1}
.empty{color:var(--mute);padding:20px 4px}
.toast{position:fixed;bottom:calc(76px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--cream);padding:10px 18px;border-radius:99px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:9}
.toast.show{opacity:1}
.login{display:grid;justify-items:center;min-height:100vh;text-align:center;gap:14px;align-content:center;max-width:340px;margin:0 auto;padding:0 16px}
.login h1{font-size:40px}
.login .fld{width:100%;text-align:left}
.login .acts{width:100%}
.err{color:#a2392b;min-height:1.4em;margin:0}
.ver{font:12px Figtree,system-ui,sans-serif;color:var(--mute)}
.hero .ver{color:#d9bf9c}
@media(max-width:560px){.top{grid-template-columns:110px 1fr}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="root"></div>
<div class="toast" id="toast"></div>
<script type="module">
/* ---------- 1. Paste your Firebase web app config here. Until then the app runs in local test mode. ---------- */
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyBbdIody6lDgrP5UzQDt7SFt-g1cLGazJA",
  authDomain: "whiskey-notes-513ed.firebaseapp.com",
  projectId: "whiskey-notes-513ed",
  storageBucket: "whiskey-notes-513ed.firebasestorage.app",
  messagingSenderId: "365703540348",
  appId: "1:365703540348:web:626da1915b95fd2b0623f9"
}

/* ---------- 2. Descriptor lists. Edit freely. ---------- */
const CATS = ["Scotch", "Irish", "Bourbon", "Rye", "Other"];
const CHAR = ["Sweet", "Spicy", "Fruity", "Smoky", "Grainy"];
const TYPES = ["Single malt", "Blended malt", "Blended", "Single grain", "Single pot still", "Straight", "Other"];
const REGIONS = { Scotch: ["Islay", "Speyside", "Highland", "Lowland", "Campbeltown", "Islands"], Irish: ["Ireland", "Northern Ireland"], Bourbon: ["Kentucky", "Tennessee", "Indiana", "Texas"], Rye: ["Kentucky", "Pennsylvania", "Maryland", "Canada"], Other: ["Japan", "Canada", "India", "Taiwan", "Australia"] };
const GUIDE = [["Sweet", "vanilla, caramel, honey, toffee, maple"], ["Spicy", "cinnamon, black pepper, clove, ginger, nutmeg"], ["Fruity", "apple, pear, citrus, berries, dried fruit"], ["Smoky", "smoke, peat, char, ash, brine"], ["Grainy", "malt, cereal, bread, nuts, grass"]];
const SECTIONS = [
  { k: "appearance", t: "Appearance", g: [["Color", 1, ["Pale straw", "Gold", "Amber", "Copper", "Mahogany"]], ["Viscosity", 1, ["Thin", "Medium", "Oily"]]] },
  { k: "nose", t: "Nose", g: [["Character", 0, CHAR]] },
  { k: "taste", t: "Taste", g: [["Character", 0, CHAR]] },
  { k: "water", t: "Water", no: 1, amt: 1, g: [["Effect on aroma", 0, ["Opened up", "Softer", "Muted", "No change"]], ["Effect on taste", 0, ["Sweeter", "Spicier", "Smoother", "Flatter", "No change"]]] },
  { k: "finish", t: "Finish", no: 1, g: [["Length", 1, ["Short", "Medium", "Long"]]] }
];

/* ---------- Storage: Firebase, or localStorage for testing ---------- */
const LOCAL = FIREBASE_CONFIG.apiKey.startsWith("PASTE");
const ls = k => JSON.parse(localStorage.getItem(k) || "{}");
let store, auth, fb, unsub;

if (LOCAL) {
  store = {
    listen(cb) { this.cb = cb; cb(Object.values(ls("dn_notes"))); },
    async save(n, photo) {
      const a = ls("dn_notes"); a[n.id] = n; localStorage.setItem("dn_notes", JSON.stringify(a));
      if (photo) { const p = ls("dn_photos"); p[n.id] = photo; localStorage.setItem("dn_photos", JSON.stringify(p)); }
      this.cb(Object.values(a));
    },
    async del(id) {
      const a = ls("dn_notes"); delete a[id]; localStorage.setItem("dn_notes", JSON.stringify(a));
      this.cb(Object.values(a));
    },
    async photo(id) { return ls("dn_photos")[id] || null; }
  };
} else {
  const V = "10.12.2", B = "https://www.gstatic.com/firebasejs/" + V + "/";
  const [app, au, fs] = await Promise.all([import(B + "firebase-app.js"), import(B + "firebase-auth.js"), import(B + "firebase-firestore.js")]);
  fb = au;
  const a = app.initializeApp(FIREBASE_CONFIG);
  auth = au.getAuth(a);
  const db = fs.initializeFirestore(a, { localCache: fs.persistentLocalCache({ tabManager: fs.persistentMultipleTabManager() }) });
  const col = n => fs.collection(db, "users", auth.currentUser.uid, n);
  // Writes are not awaited: offline, the promise only resolves once the server confirms.
  store = {
    listen(cb) { return fs.onSnapshot(col("notes"), s => cb(s.docs.map(d => d.data()))); },
    async save(n, photo) {
      fs.setDoc(fs.doc(col("notes"), n.id), n).catch(console.error);
      if (photo) fs.setDoc(fs.doc(col("photos"), n.id), { data: photo }).catch(console.error);
    },
    async del(id) {
      fs.deleteDoc(fs.doc(col("notes"), id)).catch(console.error);
      fs.deleteDoc(fs.doc(col("photos"), id)).catch(console.error);
    },
    async photo(id) { const d = await fs.getDoc(fs.doc(col("photos"), id)); return d.exists() ? d.data().data : null; }
  };
}

/* ---------- State and helpers ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const VERSION = "3.0";
let notes = [], cat = "All", q = "", view = "home", draft = null, pending = null, editing = false, step = 0;
const STEPS = ["Bottle", ...SECTIONS.map(s => s.t), "Rating"];
const TABS = ["All", ...CATS, "Favourites"];
const blank = () => ({ id: crypto.randomUUID(), name: "", distillery: "", category: "Scotch", type: "", region: "", age: "", noAge: false, abv: "", price: "", favourite: false, waterAmt: "", tags: {}, other: {}, notes: {}, rating: 0, comments: "", thumb: "", updated: 0 });
const getP = (o, p) => p.split(".").reduce((a, k) => a?.[k], o);
const setP = (o, p, v) => { const ks = p.split("."), l = ks.pop(); ks.reduce((a, k) => a[k], o)[l] = v; };
const stars = v => `<span class="stars">${[1, 2, 3, 4, 5].map(i => `<span class="s ${v >= i ? "f" : v >= i - .5 ? "h" : ""}">★</span>`).join("")}</span>`;
function toast(t) { const e = $("#toast"); e.textContent = t; e.classList.add("show"); setTimeout(() => e.classList.remove("show"), 1800); }

async function shrink(file, max, q) {
  const b = await createImageBitmap(file, { imageOrientation: "from-image" });
  const s = Math.min(1, max / Math.max(b.width, b.height));
  const c = document.createElement("canvas");
  c.width = Math.round(b.width * s); c.height = Math.round(b.height * s);
  c.getContext("2d").drawImage(b, 0, 0, c.width, c.height);
  return c.toDataURL("image/jpeg", q);
}

/* ---------- Pages ---------- */
const home = () => `<div class="hero"><h1>Dram Notes <small class="ver">v${VERSION}</small></h1><p>Explore · Taste · Record</p><button class="btn" data-a="new">+ New Tasting</button></div>
  <button class="row" data-v="coll"><span>My Collection</span><small>${notes.length} bottle${notes.length === 1 ? "" : "s"}</small></button>
  <button class="row" data-v="learn"><span>Flavour Guide</span><small>Learn and explore</small></button>
  ${LOCAL ? "" : `<button class="btn ghost" data-a="out">Sign out</button>`}`;

const learn = () => `<h2>Flavour Guide</h2><p class="mute">The five flavours used in your tasting notes.</p>${GUIDE.map(([n, e]) => `<div class="row card"><b>${n}</b><br><small>${e}</small></div>`).join("")}`;

const coll = () => `<h2>My Collection</h2><input class="srch" id="q" type="search" placeholder="Search bottles" value="${esc(q)}">
  <div class="tabs">${TABS.map(c => `<button class="tab ${c === cat ? "on" : ""}" data-c="${c}">${c === "Favourites" ? "♥ Favourites" : c}</button>${c === "Bourbon" ? '<span class="brk"></span>' : ""}`).join("")}</div>
  <div id="list">${listHtml()}</div>`;

function listHtml() {
  const k = q.toLowerCase();
  const rows = notes.filter(n => (cat === "All" || (cat === "Favourites" ? n.favourite : n.category === cat)) && (!k || (n.name + " " + n.distillery).toLowerCase().includes(k))).sort((a, b) => b.updated - a.updated);
  return rows.length ? rows.map(n => `<div class="item"><button class="main" data-id="${n.id}">${n.thumb ? `<img src="${n.thumb}" alt="">` : `<div class="ph"></div>`}
      <span><b>${esc(n.name)}</b><small>${esc(n.category)}${n.region ? " · " + esc(n.region) : ""}${n.abv ? " · " + esc(n.abv) + "%" : ""}</small><br>${stars(n.rating || 0)} <small>${n.rating || ""}</small></span></button>
      <button class="heart ${n.favourite ? "on" : ""}" data-fav="${n.id}" aria-label="Favourite">♥</button></div>`).join("")
    : `<p class="empty">${notes.length ? "No bottles match." : "No notes yet. Start with New Tasting on the Home page."}</p>`;
}
const renderList = () => { const l = $("#list"); if (l) l.innerHTML = listHtml(); };

function part(i, ed) {
  const n = draft;
  const fld = (k, l, t = "text", x = "") => (!ed && !getP(n, k)) ? "" : `<label class="fld">${l}<input data-f="${k}" type="${t}" ${x} value="${esc(getP(n, k))}"></label>`;
  const tx = (k, l) => (!ed && !getP(n, k)) ? "" : `<label class="fld">${l}<textarea data-f="${k}">${esc(getP(n, k))}</textarea></label>`;
  if (i === 0) {
    const src = pending || n.thumb;
    const ph = src ? `<img id="pimg" src="${src}" alt="Bottle photo">` : (ed ? "Add bottle photo<br>(tap or drop)" : "No photo");
    const sel = (k, l, opts, nb) => (!ed && !n[k]) ? "" : `<label class="fld">${l}<select data-f="${k}">${nb ? `<option value="">Not set</option>` : ""}${opts.map(o => `<option ${o === n[k] ? "selected" : ""}>${o}</option>`).join("")}</select></label>`;
    return `<div class="top"><label class="photo" id="drop">${ph}<input type="file" id="file" accept="image/*" hidden ${ed ? "" : "disabled"}></label><div class="grid">
      ${fld("name", "Bottle name *")}${fld("distillery", "Distillery")}${sel("category", "Category", CATS)}${sel("type", "Style", TYPES, 1)}
      ${fld("region", "Region", "text", 'list="rg"')}<datalist id="rg">${(REGIONS[n.category] || []).map(r => `<option value="${r}">`).join("")}</datalist>
      ${fld("age", "Age (years)", "number", `inputmode="numeric" ${n.noAge ? "disabled" : ""}`)}${ed || n.noAge ? `<label class="chip"><input type="checkbox" data-f="noAge" ${n.noAge ? "checked" : ""}><span>No age statement</span></label>` : ""}
      ${fld("abv", "ABV %", "number", 'inputmode="decimal" step="0.1"')}${fld("price", "Price")}</div></div>`;
  }
  if (i === STEPS.length - 1) {
    const v = n.rating || 0;
    const r = ed ? `<div class="rate" id="rate">${[1, 2, 3, 4, 5].map(k => `<span class="s ${v >= k ? "f" : v >= k - .5 ? "h" : ""}"><b data-r="${k - .5}"></b><b data-r="${k}"></b>★</span>`).join("")}</div><p class="mute" id="rv">${v ? v + " / 5" : "Tap a star. The left half gives a half star."}</p>`
      : (v ? `<div class="big">${stars(v)} <span class="mute">${v} / 5</span></div>` : "");
    return r + tx("comments", "Overall comments");
  }
  const s = SECTIONS[i - 1];
  const groups = s.g.map(([g, one, items]) => {
    const sl = n.tags[s.k + "|" + g] || [];
    const shown = ed ? items : items.filter(x => sl.includes(x));
    return shown.length ? `<fieldset><legend>${g}</legend><div class="chips">${shown.map(x => `<label class="chip"><input type="${one ? "radio" : "checkbox"}" name="${s.k}|${g}" data-g="${s.k}|${g}" value="${esc(x)}" ${sl.includes(x) ? "checked" : ""}><span>${x}</span></label>`).join("")}</div></fieldset>` : "";
  }).join("");
  return `${s.amt ? fld("waterAmt", "Amount of water", "text", 'placeholder="e.g. 3 drops, 1 tsp"') : ""}${groups}${s.no ? "" : fld("other." + s.k, "Other descriptors")}${tx("notes." + s.k, "Notes")}`;
}

function noteView() {
  const n = draft, saved = notes.some(x => x.id === n.id), last = STEPS.length - 1;
  if (!editing) {
    const body = STEPS.map((t, i) => { const h = part(i, false); return i === 0 ? h : (h.trim() ? `<div class="sec"><h3>${t}</h3>${h}</div>` : ""); }).join("");
    return `<div class="dhead"><button class="btn ghost" data-v="coll">‹ Collection</button><button class="heart ${n.favourite ? "on" : ""}" data-fav="${n.id}" aria-label="Favourite">♥</button></div>
      <h2>${esc(n.name)}</h2><fieldset class="lock" disabled>${body}</fieldset>
      <div class="acts"><button class="btn" data-a="edit">Edit note</button>${saved ? `<button class="btn danger" data-a="del">Delete</button>` : ""}</div>`;
  }
  return `<div class="dhead"><h2>${saved ? "Edit tasting" : "New tasting"}</h2><button class="btn ghost" data-a="cancel">Cancel</button></div>
    <div class="tabs">${STEPS.map((t, i) => `<button class="tab ${i === step ? "on" : ""}" data-step="${i}">${t}</button>`).join("")}</div>
    ${step ? `<h3>${STEPS[step]}</h3>` : ""}${part(step, true)}
    <div class="acts">${step ? `<button class="btn ghost" data-a="back">Back</button>` : ""}${step < last ? `<button class="btn" data-a="next">Next</button>` : ""}<button class="btn ${step < last ? "ghost" : ""}" data-a="save">Save</button></div>`;
}

function render() {
  $("#page").innerHTML = ({ home, coll, learn, note: noteView })[view]();
  document.querySelectorAll(".bar button").forEach(b => b.classList.toggle("on", b.dataset.v === (view === "note" ? "coll" : view)));
  if (view === "note" && editing && step === 0) bindPhoto();
  window.scrollTo(0, 0);
}

function bindPhoto() {
  const d = $("#drop");
  d.ondragover = e => { e.preventDefault(); d.classList.add("drag"); };
  d.ondragleave = () => d.classList.remove("drag");
  d.ondrop = e => { e.preventDefault(); d.classList.remove("drag"); if (e.dataTransfer.files[0]) setPhoto(e.dataTransfer.files[0]); };
  $("#file").onchange = e => e.target.files[0] && setPhoto(e.target.files[0]);
}
async function setPhoto(file) {
  try {
    draft.thumb = await shrink(file, 200, 0.7);
    pending = await shrink(file, 800, 0.8);
    $("#drop").innerHTML = `<img id="pimg" src="${pending}" alt="Bottle photo"><input type="file" id="file" accept="image/*" hidden>`;
    $("#file").onchange = e => e.target.files[0] && setPhoto(e.target.files[0]);
  } catch { toast("Could not read that image. Try a JPEG or PNG."); }
}

async function openNote(n, edit) {
  draft = n; editing = edit; pending = null; step = 0; view = "note"; render();
  if (n.thumb && !edit) { const f = await store.photo(n.id); const i = $("#pimg"); if (f && i && draft?.id === n.id) i.src = f; }
}
function toggleFav(id) {
  const n = notes.find(x => x.id === id); if (!n) return;
  n.favourite = !n.favourite; store.save({ ...n }, null);
  if (draft?.id === id) draft.favourite = n.favourite;
  view === "note" ? render() : renderList();
}
function paintRate() {
  document.querySelectorAll("#rate .s").forEach((e, k) => { const i = k + 1, v = draft.rating; e.className = "s " + (v >= i ? "f" : v >= i - .5 ? "h" : ""); });
  $("#rv").textContent = draft.rating ? draft.rating + " / 5" : "Tap a star. The left half gives a half star.";
}

function onClick(e) {
  const t = e.target;
  const r = t.closest("[data-r]");
  if (r && editing) { const v = +r.dataset.r; draft.rating = draft.rating === v ? 0 : v; paintRate(); return; }
  const f = t.closest("[data-fav]"); if (f) { toggleFav(f.dataset.fav); return; }
  const id = t.closest("[data-id]")?.dataset.id;
  if (id) { openNote({ ...blank(), ...structuredClone(notes.find(n => n.id === id)) }, false); return; }
  const c = t.closest("[data-c]"); if (c) { cat = c.dataset.c; render(); return; }
  const v = t.closest("[data-v]");
  if (v) { if (editing && !confirm("Discard unsaved changes?")) return; editing = false; view = v.dataset.v; if (view !== "note") draft = null; render(); return; }
  const sp = t.closest("[data-step]"); if (sp) { step = +sp.dataset.step; render(); return; }
  const a = t.closest("[data-a]")?.dataset.a;
  if (a === "new") openNote(blank(), true);
  if (a === "out") fb.signOut(auth);
  if (a === "back") { step--; render(); }
  if (a === "next") { step++; render(); }
  if (a === "edit") { editing = true; step = 0; render(); }
  if (a === "cancel") {
    const o = notes.find(n => n.id === draft.id);
    if (o) openNote({ ...blank(), ...structuredClone(o) }, false); else { draft = null; editing = false; view = "coll"; render(); }
  }
  if (a === "save") {
    if (!draft.name.trim()) { toast("Add a bottle name first"); step = 0; render(); return; }
    draft.updated = Date.now();
    store.save(draft, pending);
    const copy = structuredClone(draft), i = notes.findIndex(n => n.id === draft.id);
    if (i < 0) notes.push(copy); else notes[i] = copy;
    toast("Saved"); openNote(structuredClone(copy), false);
  }
  if (a === "del" && confirm("Delete this note? This cannot be undone.")) {
    store.del(draft.id); notes = notes.filter(n => n.id !== draft.id);
    draft = null; editing = false; view = "coll"; render(); toast("Deleted");
  }
}

function onInput(e) {
  const t = e.target;
  if (t.id === "q") { q = t.value; renderList(); return; }
  if (!editing) return;
  if (t.dataset.g) { draft.tags[t.dataset.g] = [...document.querySelectorAll(`[data-g="${t.dataset.g}"]:checked`)].map(i => i.value); return; }
  const f = t.dataset.f; if (!f) return;
  setP(draft, f, t.type === "checkbox" ? t.checked : t.value);
  if (f === "noAge") { const a = document.querySelector('[data-f="age"]'); a.disabled = t.checked; if (t.checked) { a.value = ""; draft.age = ""; } }
  if (f === "category") $("#rg").innerHTML = (REGIONS[t.value] || []).map(r => `<option value="${r}">`).join("");
}
$("#root").addEventListener("click", onClick);
$("#root").addEventListener("input", onInput);
$("#root").addEventListener("change", onInput);

function start() {
  view = "home"; draft = null; editing = false;
  $("#root").innerHTML = `<main class="page" id="page"></main><nav class="bar">${[["home", "Home"], ["coll", "Collection"], ["learn", "Learn"]].map(([v, l]) => `<button data-v="${v}">${l}</button>`).join("")}</nav>`;
  render();
  unsub?.();
  unsub = store.listen(list => { notes = list; if (view === "coll") renderList(); else if (view === "home") render(); });
}

/* ---------- Boot ---------- */
if (LOCAL) start();
else {
  const authErr = c => ({
    "auth/invalid-credential": "Wrong email or password.",
    "auth/invalid-email": "That email address is not valid.",
    "auth/email-already-in-use": "An account with that email already exists. Sign in instead.",
    "auth/weak-password": "Use a password of at least 6 characters.",
    "auth/operation-not-allowed": "Email and password sign-in is not enabled in Firebase.",
    "auth/too-many-requests": "Too many attempts. Wait a few minutes and try again."
  }[c] || "Sign-in failed. Check your connection and try again.");
  fb.onAuthStateChanged(auth, u => {
    if (u) { start(); return; }
    unsub?.(); unsub = null; notes = []; draft = null;
    $("#root").innerHTML = `<form class="login" id="lf"><h1>Dram Notes</h1><small class="ver">v${VERSION}</small>
      <label class="fld">Email<input id="em" type="email" autocomplete="username"></label>
      <label class="fld">Password<input id="pw" type="password" autocomplete="current-password"></label>
      <p class="err" id="err" role="alert"></p>
      <div class="acts"><button class="btn" type="submit">Sign in</button><button class="btn ghost" type="button" id="mk">Create account</button></div></form>`;
    const go = async make => {
      const em = $("#em").value.trim(), pw = $("#pw").value;
      if (!em || !pw) { $("#err").textContent = "Enter your email and password."; return; }
      try { await make(auth, em, pw); } catch (e) { $("#err").textContent = authErr(e.code); }
    };
    $("#lf").onsubmit = e => { e.preventDefault(); go(fb.signInWithEmailAndPassword); };
    $("#mk").onclick = () => go(fb.createUserWithEmailAndPassword);
  });
}
</script>
</body>
</html>
